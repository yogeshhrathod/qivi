name: CI & showcase

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: showcase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    outputs:
      pages-enabled: ${{ steps.pages-status.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test library & documentation
        run: npm test
      - name: Build showcase
        run: npm run build:showcase
      - name: Save showcase preview
        uses: actions/upload-artifact@v7
        with:
          name: showcase-dist
          path: dist
          if-no-files-found: error
          retention-days: 14
      - name: Check Pages availability
        id: pages-status
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' > /tmp/qivi-pages-build-type; then
            if [ "$(cat /tmp/qivi-pages-build-type)" = "workflow" ]; then
              echo "enabled=true" >> "$GITHUB_OUTPUT"
            else
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::warning::Set Pages source to GitHub Actions to enable automatic deployment."
            fi
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Pages is unavailable or not enabled. The showcase-dist artifact is ready to download."
          fi
      - name: Configure Pages
        if: steps.pages-status.outputs.enabled == 'true'
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        if: steps.pages-status.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy showcase
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.pages-enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
